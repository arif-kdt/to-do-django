{% extends 'base.html' %}
{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold mb-0">{{ todo.title }}</h2>
                        {% if todo.status %}
                        <span class="badge bg-success">Completed</span>
                        {% else %}
                        <span class="badge bg-warning text-dark">Pending</span>
                        {% endif %}
                    </div>
                    <p class="text-muted mb-4">{{ todo.description }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch" name="status" value="true"
                                id="status" {% if todo.status %}checked{% endif %} onchange="this.form.submit()">
                            <label class="form-check-label fw-semibold" for="status">
                                Completed
                            </label>
                        </div>
                    </form>
                    <div class="d-flex gap-2">
                        <a href="{% url 'edit_todo' todo.id %}" class="btn btn-primary">
                            Edit
                        </a>
                        <a href="{% url 'delete_todo' todo.id %}" class="btn btn-danger">
                            Delete
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                            Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
